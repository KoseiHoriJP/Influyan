    function populateCityToRegion() {
        for (const [region, cities] of Object.entries(japaneseRegionGroups)) {
            cities.forEach(city => {
                cityToRegion[city] = region; // Japanese city name maps to Japanese region name
            });
        }
        for (const [region, cities] of Object.entries(englishRegionGroups)) {
            cities.forEach(city => {
                cityToRegion[city] = region; // English city name maps to English region name
            });
        }
    }

    // Define getColor function for choropleth styling
    function getColor(d) {
        return d > 50 ? '#800026' :
               d > 20  ? '#BD0026' :
               d > 10  ? '#E31A1C' :
               d > 5   ? '#FC4E2A' :
               d > 2   ? '#FD8D3C' :
               d > 0   ? '#FEB24C' :
                         '#FFFFFF'; // White for 0 cases or no data
    }

    function updateInfoBox(name, cases, additionalInfo = {}) {
        let displayName = name;
        let regionGroupDisplayName = additionalInfo.regionGroup;
        let prefectureDisplayName = additionalInfo.prefecture;

        if (currentLanguage === 'en') {
            // If the input name is Japanese, convert it to English for display
            if (Object.values(japaneseRegionGroups).flat().includes(name)) { // Check if it's a Japanese city name
                displayName = cityNameToEnglish[name] || name;
            } else if (Object.keys(japaneseRegionGroups).includes(name)) { // Check if it's a Japanese region group name
                // Find the English equivalent of the region group name
                const japRegionKey = Object.keys(japaneseRegionGroups).find(key => key === name);
                displayName = Object.keys(englishRegionGroups).find(key => REGION_GROUP_TO_DB_NAME_MAP[key] === REGION_GROUP_TO_DB_NAME_MAP[japRegionKey]) || name;
            } else if (name.includes("Prefecture") && prefectureTranslation[name]) { // Check if it's a prefecture name
                displayName = prefectureTranslation[name].en;
            }

            if (additionalInfo.isCitySearch && additionalInfo.originalCityName) {
                displayName = cityNameToEnglish[additionalInfo.originalCityName] || additionalInfo.originalCityName;
            }


            if (regionGroupDisplayName && Object.keys(japaneseRegionGroups).includes(regionGroupDisplayName)) {
                 const japRegionKey = Object.keys(japaneseRegionGroups).find(key => key === regionGroupDisplayName);
                 regionGroupDisplayName = Object.keys(englishRegionGroups).find(key => REGION_GROUP_TO_DB_NAME_MAP[key] === REGION_GROUP_TO_DB_NAME_MAP[japRegionKey]);
            }
            if (prefectureDisplayName && prefectureTranslation[prefectureDisplayName]) {
                prefectureDisplayName = prefectureTranslation[prefectureDisplayName].en;
            }

        } else { // currentLanguage === 'ja'
            // If the input name is English, convert it to Japanese for display
            if (Object.values(englishRegionGroups).flat().includes(name)) { // Check if it's an English city name
                displayName = englishToJapaneseCity[name] || name;
            } else if (Object.keys(englishRegionGroups).includes(name)) { // Check if it's an English region group name
                // Find the Japanese equivalent of the region group name
                const engRegionKey = Object.keys(englishRegionGroups).find(key => key === name);
                displayName = Object.keys(japaneseRegionGroups).find(key => REGION_GROUP_TO_DB_NAME_MAP[key] === REGION_GROUP_TO_DB_NAME_MAP[engRegionKey]) || name;
            } else if (name.includes("Prefecture") && prefectureTranslation[name]) { // Check if it's a prefecture name
                displayName = prefectureTranslation[name].ja;
            }

            if (additionalInfo.isCitySearch && additionalInfo.originalCityName) {
                 displayName = additionalInfo.originalCityName;
            }


            if (regionGroupDisplayName && Object.keys(englishRegionGroups).includes(regionGroupDisplayName)) {
                 const engRegionKey = Object.keys(englishRegionGroups).find(key => key === regionGroupDisplayName);
                 regionGroupDisplayName = Object.keys(japaneseRegionGroups).find(key => REGION_GROUP_TO_DB_NAME_MAP[key] === REGION_GROUP_TO_DB_NAME_MAP[engRegionKey]);
            }
             if (prefectureDisplayName && prefectureTranslation[prefectureDisplayName]) {
                prefectureDisplayName = prefectureTranslation[prefectureDisplayName].ja;
            }
        }

        let content = `<b>${currentLanguage === 'ja' ? '名前' : 'Name'}:</b> ${displayName}<br>`;
        if (additionalInfo.isCitySearch && regionGroupDisplayName) {
            content += `<b>${currentLanguage === 'ja' ? '症例数 (地域グループ)' : 'Case amount (Region Group)'}:</b> ${cases}`;
        } else {
            content += `<b>${currentLanguage === 'ja' ? '症例数' : 'Cases'}:</b> ${cases}`;
        }

        if (prefectureDisplayName) {
            content += `<br><b>${currentLanguage === 'ja' ? '都道府県' : 'Prefecture'}:</b> ${prefectureDisplayName}`;
        }
        if (regionGroupDisplayName && !additionalInfo.isCitySearch) {
            content += `<br><b>${currentLanguage === 'ja' ? '地域グループ' : 'Region Group'}:</b> ${regionGroupDisplayName}`;
        } else if (additionalInfo.isCitySearch && regionGroupDisplayName) {
             content += `<br><b>${currentLanguage === 'ja' ? '地域グループ' : 'Region Group'}:</b> ${regionGroupDisplayName}`;
        }
        infoContent.innerHTML = content;
    }

    // Keep clearInfoBox as a separate function

    // Function to adjust zoom control position
    function adjustZoomControlPosition() {
        if (searchPanel.classList.contains('collapsed')) {
            zoomControlElement.style.left = `10px`;
        } else {
            zoomControlElement.style.left = `${searchPanel.offsetWidth + 20}px`;

    let regionCaseData = {}; // Global variable to store case data
    let allFeatures = [];
    let prefectureGroups = {
        "Osaka-Prefecture": [],
        "Kyoto-Prefecture": [],
        "Nara-Prefecture" : []
    };

    // Encapsulate map drawing logic in a function
    function initializeMap() {
        map.eachLayer(function(layer) {
            if (layer instanceof L.GeoJSON) {
                map.removeLayer(layer);
            }
        });
        overlayMaps = {};
        prefectureGroups = {
            "Osaka-Prefecture": [],
            "Kyoto-Prefecture": [],
            "Nara-Prefecture" : []
        };

        // Use absolute URLs for fetching GeoJSON data
        $.when(
            $.getJSON('http://127.0.0.1:5000/static/kyoto_overlay.json'),
            $.getJSON('http://127.0.0.1:5000/static/osaka_overlay.json'),
            $.getJSON('http://127.0.0.1:5000/static/nara_overlay.json')
        ).done(function(kyotoData, osakaData, naraData) {
            allFeatures = kyotoData[0].features
                                        .concat(osakaData[0].features)
                                        .concat(naraData[0].features);

            for (const feature of allFeatures) {
                const pref = feature.properties.N03_001;
                // Add feature to prefectureGroups for later use
                if (pref === "大阪府") {
                    prefectureGroups["Osaka-Prefecture"].push(feature);
                } else if (pref === "京都府") {
                    prefectureGroups["Kyoto-Prefecture"].push(feature);
                } else if (pref === "奈良県") {
                    prefectureGroups["Nara-Prefecture"].push(feature);
                }
                // Ensure N03_004 exists before adding to cityToFeature
                if (feature.properties.N03_004) {
                    cityToFeature[feature.properties.N03_004] = feature;
                    // Also store English name mapping if available
                    if (cityNameToEnglish[feature.properties.N03_004]) {
                        cityToFeature[cityNameToEnglish[feature.properties.N03_004]] = feature;
                    }
                }
            }

            function createGeoJsonLayer(features, baseColor, layerName, type, options = {}) {
                const layer = L.geoJson({ type: "FeatureCollection", features }, {
                    style: function(feature) { // This is now a function for dynamic styling
                        let casesForFeatureFill = 0; // Cases for this individual feature's fill color
                        const city_name_japanese = feature.properties.N03_004; // This is the city name from GeoJSON (always Japanese)

                        if (type === 'regionGroup') {
                            // If this layer is for a region group (e.g., Toyono), all its cities share that group's cases
                            // layerName here is the display name (e.g., "豊能" or "Toyono")
                            const dbRegionName = REGION_GROUP_TO_DB_NAME_MAP[layerName];
                            casesForFeatureFill = regionCaseData[dbRegionName] || 0;
                        } else if (type === 'prefecture') {
                            // If this layer is for a prefecture (e.g., Osaka Prefecture), individual cities need their region group's cases
                            const regionGroupDisplayName_japanese = cityToRegion[city_name_japanese];
                            if (regionGroupDisplayName_japanese) {
                                const dbRegionName = REGION_GROUP_TO_DB_NAME_MAP[regionGroupDisplayName_japanese];
                                casesForFeatureFill = regionCaseData[dbRegionName] || 0;
                            }
                        }
                        return {
                            fillColor: getColor(casesForFeatureFill), // Use getColor based on calculated cases
                            weight: options.weight || 2,
                            opacity: options.opacity || 0.8,
                            color: options.color || 'white', // Outline color
                            fillOpacity: options.fillOpacity || 0.7
                        };
                    },
                    onEachFeature: function(feature, layer) {
                        // The popup should show details for the specific feature clicked
                        const city_name_japanese = feature.properties.N03_004; // Always Japanese from GeoJSON
                        let currentCityName = city_name_japanese;
                        if (currentLanguage === 'en') {
                            currentCityName = cityNameToEnglish[city_name_japanese] || city_name_japanese;
                        }

                        let popupText = `<b>${currentCityName}</b><br/>`; // City name or general name

                        let actualCasesForPopup = 0;
                        const regionGroupDisplayName_japanese = cityToRegion[city_name_japanese]; // Always Japanese region group name
                        let regionGroupDisplayName_currentLang = regionGroupDisplayName_japanese;

                        if (currentLanguage === 'en' && regionGroupDisplayName_japanese) {
                            const japRegionKey = Object.keys(japaneseRegionGroups).find(key => key === regionGroupDisplayName_japanese);
                            regionGroupDisplayName_currentLang = Object.keys(englishRegionGroups).find(key => REGION_GROUP_TO_DB_NAME_MAP[key] === REGION_GROUP_TO_DB_NAME_MAP[japRegionKey]);
                        }

                        if (regionGroupDisplayName_japanese) {
                            const dbRegionName = REGION_GROUP_TO_DB_NAME_MAP[regionGroupDisplayName_japanese];
                            actualCasesForPopup = regionCaseData[dbRegionName] || 0;
                            popupText += `${currentLanguage === 'ja' ? '地域グループ' : 'Region Group'}: ${regionGroupDisplayName_currentLang || regionGroupDisplayName_japanese}<br/>`;
                            popupText += `${currentLanguage === 'ja' ? '症例数 (地域グループ)' : 'Cases (Region Group)'}: ${actualCasesForPopup}`;
                        } else {
                            popupText += `${currentLanguage === 'ja' ? '症例数: N/A (地域データなし)' : 'Cases: N/A (No specific region data)'}`;
                        }

                        feature.properties.real_cases = actualCasesForPopup;
                        layer.bindPopup(popupText);

                        layer.on('click', function(e) {
                            clearInfoBox();
                            let infoBoxRegionName = regionGroupDisplayName_currentLang || currentCityName;
                            let infoBoxCases = actualCasesForPopup;
                            let prefectureName_japanese = feature.properties.N03_001;
                            let prefectureName_currentLang = prefectureTranslation[Object.keys(prefectureTranslation).find(key => prefectureTranslation[key].ja === prefectureName_japanese)]?.[currentLanguage] || prefectureName_japanese;

                            updateInfoBox(currentCityName, infoBoxCases, {
                                isCitySearch: true,
                                regionGroup: regionGroupDisplayName_japanese, // Pass Japanese to updateInfoBox to allow translation
                                prefecture: prefectureName_japanese, // Pass Japanese to updateInfoBox to allow translation
                                originalCityName: city_name_japanese // Keep original Japanese city name for proper lookup in DB_NAME_MAP
                            });

                            let regionForForecast = null;
                            if (regionGroupDisplayName_japanese && REGION_GROUP_TO_DB_NAME_MAP[regionGroupDisplayName_japanese]) {
                                regionForForecast = REGION_GROUP_TO_DB_NAME_MAP[regionGroupDisplayName_japanese];
                            }

                            if (regionForForecast) {
                                // Use absolute URL for fetching forecast data
                                fetch(`http://172.16.1.13:5000/api/forecast?region=${regionForForecast}`)
                                    .then(res => res.json())
                                    .then(data => {
                                        if (data.error) {
                                            forecastContent.innerHTML = `<p style="color:red;">${data.error}</p>`;
                                        } else {
                                            // Use absolute URL for the image source
                                            forecastContent.innerHTML = `
                                                <img src="http://172.16.1.13:5000${data.plot_url}" onerror="this.onerror=null;this.src='https://placehold.co/400x300/cccccc/ffffff?text=Forecast+Plot+Missing';" style="width:100%; margin-top:10px;">
                                            `;
                                        }
                                        forecastBox.style.display = "block";
                                    })
                                    .catch(err => {
                                        forecastContent.innerHTML = `<p style="color:red;">${currentLanguage === 'ja' ? '予測の取得エラー' : 'Error fetching forecast'}: ${err.message}</p>`;
                                        forecastBox.style.display = "block";
                                    });
                            } else {
                                forecastBox.style.display = "none";
                            }
                        });
                    }
                });

                // Calculate total cases for the *layer's* collective popup (prefecture or region group)
                let totalCasesForLayerPopup = 0;
                let layerNameForPopup = layerName;

                if (type === 'prefecture') {
                    const currentPrefectureDbName = layerName.replace(' Prefecture', '-Prefecture');
                    totalCasesForLayerPopup += regionCaseData[currentPrefectureDbName] || 0;

                    features.forEach(f => {
                        const city_japanese = f.properties.N03_004;
                        const regionGroupDisplayName_japanese = cityToRegion[city_japanese];
                        if (regionGroupDisplayName_japanese) {
                            const dbRegionName = REGION_GROUP_TO_DB_NAME_MAP[regionGroupDisplayName_japanese];
                            totalCasesForLayerPopup += regionCaseData[dbRegionName] || 0;
                        }
                    });
                    if (currentLanguage === 'ja' && prefectureTranslation[layerName]) {
                        layerNameForPopup = prefectureTranslation[layerName].ja;
                    }
                } else if (type === 'regionGroup') {
                    const dbRegionName = REGION_GROUP_TO_DB_NAME_MAP[layerName];
                    totalCasesForLayerPopup = regionCaseData[dbRegionName] || 0;
                     if (currentLanguage === 'ja' && englishRegionGroups[layerName]) {
                        const engRegionKey = Object.keys(englishRegionGroups).find(key => key === layerName);
                        layerNameForPopup = Object.keys(japaneseRegionGroups).find(key => REGION_GROUP_TO_DB_NAME_MAP[key] === REGION_GROUP_TO_DB_NAME_MAP[engRegionKey]);
                    }
                }
                layer.bindPopup(`<b>${layerNameForPopup}</b><br>${currentLanguage === 'ja' ? '合計症例数' : 'Total Cases'}: ${totalCasesForLayerPopup}`);

                return layer;
            }

            const osakaPrefectureLayer = createGeoJsonLayer(prefectureGroups["Osaka-Prefecture"], "#FF6666", "Osaka-Prefecture", "prefecture");
            const kyotoPrefectureLayer = createGeoJsonLayer(prefectureGroups["Kyoto-Prefecture"], "#6666FF", "Kyoto-Prefecture", "prefecture");
            const naraPrefectureLayer = createGeoJsonLayer(prefectureGroups["Nara-Prefecture"], "#ffcc00", "Nara-Prefecture", "prefecture");

            overlayMaps["Osaka-Prefecture"] = osakaPrefectureLayer;
            overlayMaps["Kyoto-Prefecture"] = kyotoPrefectureLayer;
            overlayMaps["Nara-Prefecture"] = naraPrefectureLayer;

            let colorIndex = 0;
            for (const [regionName, cityList] of Object.entries(regionGroups)) {
                // Determine the Japanese city names for filtering, as GeoJSON properties are Japanese
                let japaneseCityList;
                if (currentLanguage === 'en') {
                    japaneseCityList = cityList.map(englishCity => englishToJapaneseCity[englishCity] || englishCity);
                } else {
                    japaneseCityList = cityList;
                }

                const featuresInRegion = allFeatures.filter(feature => japaneseCityList.includes(feature.properties.N03_004));

                const regionLayer = createGeoJsonLayer(featuresInRegion, colors[colorIndex % colors.length], regionName, "regionGroup");
                overlayMaps[regionName] = regionLayer;
                colorIndex++;
            }

            const searchFilterRadios = document.querySelectorAll('input[name="searchFilter"]');

            function hideAllDynamicRadioGroups() {
                prefectureRadioGroupDiv.style.display = "none";
                regionGroupRadioGroupDiv.style.display = "none";
            }

            function clearDynamicRadioGroups() {
                prefectureRadioGroupDiv.innerHTML = `<h3>${currentLanguage === 'ja' ? '都道府県:' : 'Prefectures:'}</h3>`;
                regionGroupRadioGroupDiv.innerHTML = `<h3>${currentLanguage === 'ja' ? '地域グループ:' : 'Region Groups:'}</h3>`;
            }

            function hideAllMapLayers() {
                for (const layerName in overlayMaps) {
                    if (map.hasLayer(overlayMaps[layerName])) {
                        map.removeLayer(overlayMaps[layerName]);
                    }
                }
                map.eachLayer(function(layer) {
                    if (layer.options && layer.options.isCityHighlight) {
                        map.removeLayer(layer);
                    }
                });
                clearInfoBox();
            }

            function handleDynamicRadioChange(event) {
                hideAllMapLayers();
                const selectedLayerName = event.target.value;
                if (overlayMaps[selectedLayerName]) {
                    map.addLayer(overlayMaps[selectedLayerName]);
                    map.fitBounds(overlayMaps[selectedLayerName].getBounds());

                    let totalCases = 0;
                    let dbRegionName = "";
                    let infoBoxRegionName = selectedLayerName;
                    let infoBoxPrefectureName = "";

                    if (Object.keys(regionGroups).includes(selectedLayerName)) {
                        dbRegionName = REGION_GROUP_TO_DB_NAME_MAP[selectedLayerName];
                        totalCases = regionCaseData[dbRegionName] || 0;

                        const firstCityFeature = overlayMaps[selectedLayerName].getLayers()[0]?.feature;
                        const prefecture_japanese = firstCityFeature ? firstCityFeature.properties.N03_001 : 'N/A';
                        infoBoxPrefectureName = prefectureTranslation[Object.keys(prefectureTranslation).find(key => prefectureTranslation[key].ja === prefecture_japanese)]?.[currentLanguage] || prefecture_japanese;

                        updateInfoBox(infoBoxRegionName, totalCases, { prefecture: infoBoxPrefectureName });

                    } else if (Object.keys(prefectureGroups).includes(selectedLayerName)) {
                        const currentPrefectureDbName = selectedLayerName.replace(' Prefecture', '-Prefecture');
                        totalCases += regionCaseData[currentPrefectureDbName] || 0;

                        overlayMaps[selectedLayerName].eachLayer(function(featureLayer) {
                            const city_japanese = featureLayer.feature.properties.N03_004;
                            const regionGroupDisplayName_japanese = cityToRegion[city_japanese];
                            if (regionGroupDisplayName_japanese) {
                                const dbRegionNameForCity = REGION_GROUP_TO_DB_NAME_MAP[regionGroupDisplayName_japanese];
                                totalCases += regionCaseData[dbRegionNameForCity] || 0;
                            }
                        });
                        infoBoxRegionName = prefectureTranslation[selectedLayerName]?.[currentLanguage] || selectedLayerName;
                        updateInfoBox(infoBoxRegionName, totalCases);
                    }

                    if (dbRegionName) { // Only fetch forecast for region groups, not prefectures
                        fetch(`http://172.16.1.13:5000/api/forecast?region=${dbRegionName}`)
                            .then(res => res.json())
                            .then(data => {
                                if (data.error) {
                                    forecastContent.innerHTML = `<p style="color:red;">${data.error}</p>`;
                                } else {
                                    forecastContent.innerHTML = `
                                        <img src="http://172.16.1.13:5000${data.plot_url}" onerror="this.onerror=null;this.src='https://placehold.co/400x300/cccccc/ffffff?text=Forecast+Plot+Missing';" style="width:100%; margin-top:10px;">
                                    `;
                                }
                                forecastBox.style.display = "block";
                            })
                            .catch(err => {
                                forecastContent.innerHTML = `<p style="color:red;">${currentLanguage === 'ja' ? '予測の取得エラー' : 'Error fetching forecast'}: ${err.message}</p>`;
                                forecastBox.style.display = "block";
                            });
                    } else {
                        forecastBox.style.display = "none";
                    }
                }
            }

            function showPrefectureRadioButtons() {
                clearDynamicRadioGroups();
                hideAllDynamicRadioGroups();
                prefectureRadioGroupDiv.style.display = "block";

                for (const prefName of Object.keys(prefectureGroups)) {
                    const label = document.createElement("label");
                    const input = document.createElement("input");
                    input.type = "radio";
                    input.name = "dynamicSearch";
                    input.value = prefName; // Storing the internal key like "Osaka-Prefecture"
                    label.appendChild(input);
                    label.appendChild(document.createTextNode(prefectureTranslation[prefName][currentLanguage])); // Display translated name
                    prefectureRadioGroupDiv.appendChild(label);

                    input.addEventListener("change", handleDynamicRadioChange);
                }
            }

            function showRegionGroupRadioButtons() {
                clearDynamicRadioGroups();
                hideAllDynamicRadioGroups();
                regionGroupRadioGroupDiv.style.display = "block";

                const currentRegionGroups = currentLanguage === 'ja' ? japaneseRegionGroups : englishRegionGroups;
                for (const regionName of Object.keys(currentRegionGroups)) {
                    const label = document.createElement("label");
                    const input = document.createElement("input");
                    input.type = "radio";
                    input.name = "dynamicSearch";
                    input.value = regionName;
                    label.appendChild(input);
                    label.appendChild(document.createTextNode(regionName));
                    regionGroupRadioGroupDiv.appendChild(label);

                    input.addEventListener("change", handleDynamicRadioChange);
                }
            }

            searchFilterRadios.forEach(radio => {
                radio.addEventListener('change', function() {
                    hideAllMapLayers();
                    if (this.value === 'prefecture') {
                        showPrefectureRadioButtons();
                    }
                    else if (this.value === 'regionGroup') {
                        showRegionGroupRadioButtons();
                    } else { // 'all'
                        hideAllDynamicRadioGroups();
                        // Potentially add default layers if 'all' means showing everything
                        // For now, it just clears previous layers
                    }
                });
            });

            citySearchInput.placeholder = currentLanguage === 'ja' ? '🔍 市区町村名で検索...' : '🔍 Search by city name...';

            citySearchInput.addEventListener('input', function() {
                const query = this.value.toLowerCase();
                citySearchResults.innerHTML = '';
                citySearchResults.style.display = 'none';

                if (query.length > 0) {
                    let matchingCities = [];
                    if (currentLanguage === 'ja') {
                         matchingCities = allFeatures.filter(feature =>
                            feature.properties.N03_004 && feature.properties.N03_004.toLowerCase().includes(query)
                        );
                    } else { // English
                        matchingCities = allFeatures.filter(feature =>
                            feature.properties.N03_004 && cityNameToEnglish[feature.properties.N03_004] && cityNameToEnglish[feature.properties.N03_004].toLowerCase().includes(query)
                        );
                    }

                    matchingCities.forEach(feature => {
                        const originalCityName = feature.properties.N03_004; // Always Japanese from GeoJSON
                        const displayName = currentLanguage === 'ja' ? originalCityName : (cityNameToEnglish[originalCityName] || originalCityName);

                        const li = document.createElement('li');
                        li.textContent = displayName;
                        li.addEventListener('click', function() {
                            hideAllMapLayers();
                            const clickedCityJapanese = originalCityName; // Use Japanese name for internal lookup
                            const regionGroupDisplayName_japanese = cityToRegion[clickedCityJapanese];
                            const dbRegionName = REGION_GROUP_TO_DB_NAME_MAP[regionGroupDisplayName_japanese];
                            const cases = regionCaseData[dbRegionName] || 0;
                            const prefectureName_japanese = feature.properties.N03_001;
                            const prefectureName_currentLang = prefectureTranslation[Object.keys(prefectureTranslation).find(key => prefectureTranslation[key].ja === prefectureName_japanese)]?.[currentLanguage] || prefectureName_japanese;

                            // Highlight the city
                            const highlightLayer = L.geoJson(feature, {
                                style: {
                                    color: 'yellow',
                                    weight: 5,
                                    opacity: 1,
                                    fillColor: 'yellow',
                                    fillOpacity: 0.5
                                }
                            }).addTo(map);
                            highlightLayer.options.isCityHighlight = true; // Mark as highlight layer

                            if (highlightLayer.getBounds().isValid()) {
                                map.fitBounds(highlightLayer.getBounds());
                            }

                            updateInfoBox(originalCityName, cases, {
                                isCitySearch: true,
                                regionGroup: regionGroupDisplayName_japanese, // Pass Japanese to updateInfoBox to allow translation
                                prefecture: prefectureName_japanese, // Pass Japanese to updateInfoBox to allow translation
                                originalCityName: originalCityName
                            });

                            let regionForForecast = null;
                            if (regionGroupDisplayName_japanese && REGION_GROUP_TO_DB_NAME_MAP[regionGroupDisplayName_japanese]) {
                                regionForForecast = REGION_GROUP_TO_DB_NAME_MAP[regionGroupDisplayName_japanese];
                            }

                            if (regionForForecast) {
                                fetch(`http://172.16.1.13:5000/api/forecast?region=${regionForForecast}`)
                                    .then(res => res.json())
                                    .then(data => {
                                        if (data.error) {
                                            forecastContent.innerHTML = `<p style="color:red;">${data.error}</p>`;
                                        } else {
                                            forecastContent.innerHTML = `
                                                <img src="http://172.16.1.13:5000${data.plot_url}" onerror="this.onerror=null;this.src='https://placehold.co/400x300/cccccc/ffffff?text=Forecast+Plot+Missing';" style="width:100%; margin-top:10px;">
                                            `;
                                        }
                                        forecastBox.style.display = "block";
                                    })
                                    .catch(err => {
                                        forecastContent.innerHTML = `<p style="color:red;">${currentLanguage === 'ja' ? '予測の取得エラー' : 'Error fetching forecast'}: ${err.message}</p>`;
                                        forecastBox.style.display = "block";
                                    });
                            } else {
                                forecastBox.style.display = "none";
                            }

                            citySearchInput.value = '';
                            citySearchResults.innerHTML = '';
                            citySearchResults.style.display = 'none';
                        });
                        citySearchResults.appendChild(li);
                    });

                    if (matchingCities.length > 0) {
                        citySearchResults.style.display = 'block';
                    }
                }
            });

            regionSearchSelect.addEventListener('change', function() {
                hideAllMapLayers();
                const selectedValue = this.value; // This will be the display name in the current language
                
                // Determine the internal (Japanese) name for region groups for lookup
                let internalRegionName = selectedValue; // Assume it's already internal if Japanese
                if (currentLanguage === 'en' && englishRegionGroups[selectedValue]) {
                    // Find the Japanese equivalent key for the selected English region group name
                    const engRegionKey = Object.keys(englishRegionGroups).find(key => key === selectedValue);
                    internalRegionName = Object.keys(japaneseRegionGroups).find(key => REGION_GROUP_TO_DB_NAME_MAP[key] === REGION_GROUP_TO_DB_NAME_MAP[engRegionKey]);
                }

                if (overlayMaps[internalRegionName || selectedValue]) { // Try internal, then selectedValue
                    const layerToLoad = overlayMaps[internalRegionName || selectedValue];
                    map.addLayer(layerToLoad);
                    map.fitBounds(layerToLoad.getBounds());

                    let totalCasesForInfoBox = 0;
                    let dbRegionName = "";
                    let infoBoxRegionName = selectedValue;
                    let infoBoxPrefectureName = "";

                    if (Object.keys(regionGroups).includes(selectedValue)) { // If it's a region group
                        dbRegionName = REGION_GROUP_TO_DB_NAME_MAP[selectedValue];
                        totalCasesForInfoBox = regionCaseData[dbRegionName] || 0;

                        const firstCityFeature = layerToLoad.getLayers()[0]?.feature;
                        const prefecture_japanese = firstCityFeature ? firstCityFeature.properties.N03_001 : 'N/A';
                        infoBoxPrefectureName = prefectureTranslation[Object.keys(prefectureTranslation).find(key => prefectureTranslation[key].ja === prefecture_japanese)]?.[currentLanguage] || prefecture_japanese;

                        updateInfoBox(selectedValue, totalCasesForInfoBox, { prefecture: infoBoxPrefectureName });

                    } else if (Object.keys(prefectureGroups).includes(selectedValue)) { // If it's a prefecture
                        const currentPrefectureDbName = selectedValue.replace(' Prefecture', '-Prefecture'); // Assuming English format
                        totalCasesForInfoBox += regionCaseData[currentPrefectureDbName] || 0;

                        layerToLoad.eachLayer(function(featureLayer) {
                            const city_japanese = featureLayer.feature.properties.N03_004;
                            const regionGroupDisplayName_japanese = cityToRegion[city_japanese];
                            if (regionGroupDisplayName_japanese) {
                                const dbRegionNameForCity = REGION_GROUP_TO_DB_NAME_MAP[regionGroupDisplayName_japanese];
                                totalCasesForInfoBox += regionCaseData[dbRegionNameForCity] || 0;
                            }
                        });
                        infoBoxRegionName = prefectureTranslation[selectedValue]?.[currentLanguage] || selectedValue;
                        updateInfoBox(infoBoxRegionName, totalCasesForInfoBox);
                        forecastBox.style.display = "none";
                    }

                    if (dbRegionName) {
                        fetch(`http://172.16.1.13:5000/api/forecast?region=${dbRegionName}`)
                            .then(res => res.json())
                            .then(data => {
                                if (data.error) {
                                    forecastContent.innerHTML = `<p style="color:red;">${data.error}</p>`;
                                } else {
                                    forecastContent.innerHTML = `
                                        <img src="http://172.16.1.13:5000${data.plot_url}" onerror="this.onerror=null;this.src='https://placehold.co/400x300/cccccc/ffffff?text=Forecast+Plot+Missing';" style="width:100%; margin-top:10px;">
                                    `;
                                }
                                forecastBox.style.display = "block";
                            })
                            .catch(err => {
                                forecastContent.innerHTML = `<p style="color:red;">${currentLanguage === 'ja' ? '予測の取得エラー' : 'Error fetching forecast'}: ${err.message}</p>`;
                                forecastBox.style.display = "block";
                            });
                    }
                }
            });

            // Populate search dropdowns after layers are initialized
            function updateSearchOptions() {
                regionSearchSelect.innerHTML = `<option disabled selected>${currentLanguage === 'ja' ? '🔽 地域または都道府県にジャンプ...' : '🔽 Jump to region or prefecture...'}</option>`;
                
                const currentRegionGroups = currentLanguage === 'ja' ? japaneseRegionGroups : englishRegionGroups;
                for (const name of Object.keys(currentRegionGroups)) {
                    const option = document.createElement("option");
                    option.value = name;
                    option.textContent = name;
                    regionSearchSelect.appendChild(option);
                }
                for (const name of Object.keys(prefectureGroups)) {
                    const option = document.createElement("option");
                    option.value = name; // Storing internal key like "Osaka-Prefecture"
                    option.textContent = prefectureTranslation[name][currentLanguage]; // Display translated name
                    regionSearchSelect.appendChild(option);
                }
            }
            updateSearchOptions();

            // --- Collapsible Panel Logic (Horizontal Slide) ---
            toggleSearchPanelButton.addEventListener('click', function() {
                const isCollapsed = searchPanel.classList.toggle('collapsed');
                if (isCollapsed) {
                    toggleSearchPanelButton.textContent = '▶';
                } else {
                    toggleSearchPanelButton.textContent = '◀';
                }
                setTimeout(adjustZoomControlPosition, 500);
            });

            // Initial adjustment of zoom control position after map is fully loaded
            adjustZoomControlPosition();
            window.addEventListener('resize', adjustZoomControlPosition);
        });
    }

   
    languageToggleBtn.addEventListener('click', function() {
    currentLanguage = currentLanguage === 'ja' ? 'en' : 'ja';
    this.textContent = currentLanguage === 'ja' ? '日本語 / English' : 'English / 日本語';

    // Update UI elements
    document.querySelector('label input[value="all"]').nextSibling.textContent = currentLanguage === 'ja' ? 'すべて' : 'All';
    document.querySelector('label input[value="prefecture"]').nextSibling.textContent = currentLanguage === 'ja' ? '都道府県' : 'Prefectures';
    document.querySelector('label input[value="regionGroup"]').nextSibling.textContent = currentLanguage === 'ja' ? '地域グループ' : 'Region Groups';
    document.querySelector('#prefectureRadioGroup h3').textContent = currentLanguage === 'ja' ? '都道府県:' : 'Prefectures:';
    document.querySelector('#regionGroupRadioGroup h3').textContent = currentLanguage === 'ja' ? '地域グループ:' : 'Region Groups:';
    document.querySelector('#citySearch').placeholder = currentLanguage === 'ja' ? '🔍 市区町村名で検索...' : '🔍 Search by city name...';
    document.querySelector('#infoBox h4').textContent = currentLanguage === 'ja' ? '場所の詳細' : 'Location Details';
    document.querySelector('#forecastBox h4').textContent = currentLanguage === 'ja' ? 'インフルエンザ予測' : 'Influenza Forecast';

    // Translate navigation bar links
    document.getElementById('navHome').textContent = currentLanguage === 'ja' ? 'ホーム' : 'Home';
    document.getElementById('navForecast').textContent = currentLanguage === 'ja' ? 'インフルエンザの予測' : 'Influenza Forecast';
    document.getElementById('navRiskAssessment').textContent = currentLanguage === 'ja' ? 'リスク評価' : 'Risk Assessment';

    document.querySelector('#regionSearch option[disabled][selected]').textContent =
        currentLanguage === 'ja' ? '🔽 地域または都道府県にジャンプ...' : '🔽 Jump to region or prefecture...';


    // Update active regionGroups and re-initialize map layers and search options
    regionGroups = currentLanguage === 'ja' ? japaneseRegionGroups : englishRegionGroups;
    hideAllMapLayers();
    initializeMap();
    clearInfoBox(); // This line should trigger the update for infoContent and forecastContent

    // Reset radio button selection and hide dynamic groups
    document.querySelector('input[name="searchFilter"][value="all"]').checked = true;
    hideAllDynamicRadioGroups();
});


    // This is the main fetch that initiates everything
    // Use absolute URL for fetching total cases data
    fetch('http://172.16.1.13:5000/api/total_cases')
      .then(response => response.json())
      .then(caseData => {
        console.log("✅ API Cases Data Received:", caseData);
        regionCaseData = caseData; // CRITICAL: Assign fetched data to global variable

        // Debugging: Check for name mismatches from API data vs expected map names
        console.log("--- API Data Name Check ---");
        const expectedNames = Object.values(REGION_GROUP_TO_DB_NAME_MAP)
          .concat([
            "Osaka-Prefecture",
            "Kyoto-Prefecture",
            "Nara-Prefecture"
          ]);

        expectedNames.forEach(name => {
          if (!(name in caseData)) {
            console.warn(`⚠️ API MISMATCH: "${name}" not found in API data. May show 0 on map.`);
          } else {
            console.log(`✅ "${name}" → Cases: ${caseData[name]}`);
          }
        });
        console.log("--- End API Data Name Check ---");

        initializeMap(); // Trigger map draw only after data is ready
      })
      .catch(error => console.error("❌ Error fetching cases data:", error));


</script>
